<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtitle Sync Tool</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
</head>
<body>
    <div id="app" class="container">
        <h1>Subtitle Sync Tool</h1>
        <form @submit.prevent="syncSubtitle">
            <div class="form-group">
                <label for="offset">Offset:</label>
                <input type="text" id="offset" v-model="offset" placeholder="+/-HH:MM:SS,ms or HH:MM:SS,ms" required>
            </div>
            
            <div class="form-group">
                <label for="file-type">File Type:</label>
                <select id="file-type" v-model="fileType" required>
                    <option value="srt">SRT</option>
                    <option value="ass">ASS</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="subtitle-file">Subtitle File:</label>
                <input type="file" id="subtitle-file" @change="handleFileUpload" required>
            </div>
            
            <button type="submit">Sync</button>
        </form>
        
        <div v-if="result" id="result-container">
            <h2>Sync Result:</h2>
            <textarea id="result" v-model="result" rows="10" readonly></textarea>
            <button @click="downloadResult" class="download-btn">Download Modified Subtitle File</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
